# conda env create -f environment.yml && conda activate facebench
name: facebench
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - numpy=2.0.1
  - pandas=2.3.3
  - scikit-learn=1.6.1
  - scipy=1.13.1
  - matplotlib=3.9.4
  - pip:
      - torch==2.8.0
      - trimesh==4.11.5
      - plyfile
