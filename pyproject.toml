[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "facebench"
version = "1.0.0"
description = "Benchmark of 3D facial point-cloud representations for craniofacial screening and syndrome diagnosis (FaceBase)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
  "torch>=2.0", "numpy", "pandas", "scipy", "scikit-learn", "matplotlib",
  "trimesh", "plyfile", "Pillow",
]

[project.optional-dependencies]
registration = ["open3d"]          # Supplementary Fig. S1a only
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["facebench*", "analyses*", "figures*"]
